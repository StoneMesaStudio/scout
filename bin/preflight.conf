# preflight.conf — what `bin/preflight.sh` builds/tests for THIS app.
# Sourced by preflight.sh. One CHECK per line:  "label | scheme | dest | action"
#   dest    : macos | ios-sim | ios-generic | watch-generic | <full -destination>
#   action  : test (build + run tests)  |  build (compile only)
APP_NAME="Scout"

# macOS-only. The `test` action builds the app AND runs the ScoutCore suite, which is where the
# ranking lives — the one part of this app that can be wrong without looking wrong.
CHECKS=(
  "macOS | Scout | macos | test"
)

BACKENDS=()
